<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xueying Luo | Portfolio</title>
    <!-- 引入 Google 字体增强高级感 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2d3436;
            --accent-color: #0984e3;
            --bg-color: #f9f9f9;
            --text-color: #636e72;
            --max-width: 850px; /* 限制页面宽度，保证阅读舒适度 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.8;
            padding: 40px 20px;
        }

        /* 页面容器限制宽度并居中 */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        /* 顶部导航/名字区域 */
        header {
            text-align: center;
            padding: 80px 0 40px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        /* 自我介绍 */
        .intro {
            text-align: center;
            max-width: 600px;
            margin: 0 auto 30px;
            color: var(--text-color);
            font-size: 1.1rem;
        }

        /* 简历按钮 */
        .btn-container {
            text-align: center;
            margin-bottom: 80px;
        }

        .resume-btn {
            display: inline-block;
            padding: 12px 35px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .resume-btn:hover {
            transform: translateY(-2px);
            background-color: var(--accent-color);
            box-shadow: 0 6px 20px rgba(9, 132, 227, 0.3);
        }

        /* 作品展示标题 */
        .section-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 40px;
            position: relative;
            padding-bottom: 15px;
        }

        .section-title::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background-color: var(--accent-color);
        }

        /* 视频展示网格 */
        .work-grid {
            display: grid;
            grid-template-columns: 1fr; /* 手机端单列 */
            gap: 40px;
        }

        @media (min-width: 768px) {
            .work-grid {
                grid-template-columns: 1fr 1fr; /* 电脑端双列 */
            }
        }

        .video-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .video-card:hover {
            transform: scale(1.02);
        }

        video {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }

        .video-info {
            padding: 20px;
        }

        .video-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .video-info p {
            font-size: 0.9rem;
            color: var(--text-color);
        }

        footer {
            text-align: center;
            margin-top: 100px;
            padding-bottom: 40px;
            font-size: 0.8rem;
            color: #b2bec3;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部 -->
        <header>
            <h1>Xueying Luo</h1>
            <div class="intro">
                <p>你好，我是 Xueying Luo。一名热衷于视觉叙事与数字设计的创作者。我擅长利用动态影像捕捉灵感，并将其转化为具有影响力的视觉作品。欢迎来到我的个人空间。</p>
            </div>
            <div class="btn-container">
                <!-- 替换为你存放在 GitHub 或 COS 上的 PDF 链接 -->
                <a href="resume.pdf" target="_blank" class="resume-btn">下载个人简历</a>
            </div>
        </header>

        <!-- 作品展示 -->
        <h2 class="section-title">作品展示</h2>
        
        <div class="work-grid">
            <!-- 视频作品 1 -->
            <div class="video-card">
                <video 
                    controls 
                    playsinline 
                    preload="metadata" 
                    poster="poster1.jpg">
                    <!-- 替换为你腾讯云 COS 的视频直链 -->
                    <source src="https://your-cos-link-1.mp4" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
                <div class="video-info">
                    <h3>项目名称 01</h3>
                    <p>项目简短描述，例如：品牌宣传片 / 2024</p>
                </div>
            </div>

            <!-- 视频作品 2 -->
            <div class="video-card">
                <video 
                    controls 
                    playsinline 
                    preload="metadata" 
                    poster="poster2.jpg">
                    <!-- 替换为你腾讯云 COS 的视频直链 -->
                    <source src="https://your-cos-link-2.mp4" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
                <div class="video-info">
                    <h3>项目名称 02</h3>
                    <p>项目简短描述，例如：纪录片剪辑 / 2023</p>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <footer>
            <p>&copy; 2024 Xueying Luo. Built with Passion.</p>
        </footer>
    </div>

</body>
</html>
